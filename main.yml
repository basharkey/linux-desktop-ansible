---
- hosts: all

  pre_tasks:
    - name: Include custom playbook config
      include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/config.yml"
      tags:
        - desktop
        - music

  roles:
    - { role: "packages", tags: ["desktop", "music"] }
    - { role: "steam", tags: "desktop" }
    - { role: "nvidia-driver", tags: ["desktop", "music"] }
    - { role: "home", tags: ["desktop", "music"] }
    - { role: "music", tags: "music" }
    - { role: "bridge-interface", tags: "" }
    - { role: "vfio", tags: "desktop" }
    - { role: "vm", tags: "" }

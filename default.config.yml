---
# roles/home
user_groups:
  - lpadmin

user_dirs:
  - Downloads
  - Desktop
  - Templates
  - Public
  - Sync

systemd_user_units:
  - ssh-agent.service
  - syncthing.service
  - emacs.service

systemd_system_units:
  - cups.service

# roles/vfio
# lspci -nn
vfio_bind_ids:
  - 10de:1cb2
  - 10de:0fb9

# roles/nvidia-driver
manual_nvidia_driver_install: yes
manual_nvidia_driver_version: "570.169"

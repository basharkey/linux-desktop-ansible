---
- name: Check if an nvidia gpu is installed
  shell: lspci | grep -i nvidia
  register: nvidia_gpu
  ignore_errors: true

- name: Check if running latest kernel
  when: nvidia_gpu.rc == 0
  block:
    - name: Get running kernel version
      command: uname -r
      register: kernel

    - name: Get kernel headers verison
      shell: apt list --installed | grep -e 'linux-headers-.*-amd64' | cut -d '/' -f 1 | cut -d '-' -f 3-
      register: headers

    - name: Reboot if current running kernel doesn't match latest kernel headers
      when: kernel.stdout != headers.stdout
      command: reboot
      become: yes

- name: Install nvidia driver via apt
  when: nvidia_gpu.rc == 0 and not manual_nvidia_driver_install
  apt:
    name:
      - nvidia-driver
      - nvidia-settings
      - nvidia-smi
      - libnvcuvid1
      - libnvidia-encode1
    state: present
    install_recommends: no
  become: yes

- name: Install nvidia driver manually
  when: nvidia_gpu.rc == 0 and manual_nvidia_driver_install
  block:
    - name: Check if nvidia driver is installed
      command: which nvidia-smi

  rescue:
    - name: Download nvidia driver
      get_url:
        url: "https://us.download.nvidia.com/XFree86/Linux-x86_64/{{ manual_nvidia_driver_version }}/NVIDIA-Linux-x86_64-{{ manual_nvidia_driver_version }}.run"
        dest: "/tmp/NVIDIA-Linux-x86_64-{{ manual_nvidia_driver_version }}.run" 
        mode: '0755'

    - name: Install dkms
      apt:
        name:
          - dkms
          - libc6-dev
          - linux-headers-amd64
        install_recommends: no
        state: present

    - name: Install nvidia driver with dkms
      shell: "/tmp/NVIDIA-Linux-x86_64-{{ manual_nvidia_driver_version }}.run --silent --no-nouveau-check --skip-module-load --dkms"

    - name: Enable nvidia drm kernel mode setting
      lineinfile:
        path: /etc/modprobe.d/nvidia-drm.conf
        line: options nvidia-drm modeset=1
        state: present
        create: true
        mode: '0644'
      notify: Update initramfs

    - name: Disable nouveau driver
      blockinfile:
        path: /etc/modprobe.d/blacklist-nouveau.conf
        block: |
          options nouveau modeset=0
          blacklist nouveau
        state: present
        create: true
        mode: '0644'
      notify: Update initramfs
  become: yes

- name: Install nvidia-vaapi-driver
  when: nvidia_gpu.rc == 0
  apt:
    name:
      - nvidia-vaapi-driver
      - vainfo
    state: present
    install_recommends: no
  become: yes

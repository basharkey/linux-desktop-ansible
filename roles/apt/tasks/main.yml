---
- name: Add debian non-free repositories
  template:
    src: sources.list.j2
    dest: /etc/apt/sources.list
    mode: '0644'
  notify:
    - Apt update cache
    - Apt full upgrade
  become: yes

- name: Configure apt to not install recommended packages
  lineinfile:
    path: /etc/apt/apt.conf.d/01norecommends
    line: 'APT::Install-Recommends "0";'
    state: present
    create: true
    mode: '0644'
  become: yes
